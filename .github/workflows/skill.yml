name: mistake-brain skill

on:
  push:
    paths: ['plugins/brain-hud/skills/**', 'plugins/brain-hud/tests/skill/**', 'plugins/brain-hud/hooks/hooks.json', '.github/workflows/skill.yml']
  pull_request:
    paths: ['plugins/brain-hud/skills/**', 'plugins/brain-hud/tests/skill/**', 'plugins/brain-hud/hooks/hooks.json', '.github/workflows/skill.yml']

jobs:
  pytest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install pytest
      - run: python -m pytest plugins/brain-hud/tests/skill -q
